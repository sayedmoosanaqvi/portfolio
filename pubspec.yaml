name: portfolio
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # Added dependencies for video playback and 3D models
  video_player: ^2.8.0 
  model_viewer_plus: ^1.10.0 
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  shared_preferences: ^2.2.2
  image_picker: ^1.1.2 
  path_provider: ^2.1.3

flutter:
  uses-material-design: true

  # Registered the asset directories here
  assets:
    - assets/images/
    - assets/videos/

# This must be at the root level (no spaces before it)
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png" # You will add this image tomorrow!
  min_sdk_android: 21